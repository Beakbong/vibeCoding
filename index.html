<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #68746e;
      --paper: #f6f4ef;
      --card: #fffdf9;
      --line: #e5e2da;
      --accent: #176b5b;
      --accent-dark: #0f4f43;
      --danger: #a64b47;
      --shadow: 0 24px 70px rgba(39, 52, 45, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(225, 238, 224, 0.9), transparent 30%),
        radial-gradient(circle at 90% 88%, rgba(248, 224, 194, 0.75), transparent 28%),
        var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 56px);
      background: rgba(255, 253, 249, 0.92);
      border: 1px solid rgba(229, 226, 218, 0.9);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      line-height: 0.95;
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 20px 0 30px;
      color: var(--muted);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .todo-input {
      min-width: 0;
      flex: 1;
      padding: 15px 16px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 2px;
      font: 1rem "Trebuchet MS", sans-serif;
      outline: none;
    }

    .todo-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(23, 107, 91, 0.13);
    }

    button {
      border: 0;
      border-radius: 2px;
      cursor: pointer;
      font-family: "Trebuchet MS", sans-serif;
      font-weight: 700;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    button:active { transform: translateY(1px); }

    .add-button {
      padding: 0 20px;
      color: #fff;
      background: var(--accent);
      font-size: 0.95rem;
    }

    .add-button:hover { background: var(--accent-dark); }

    .list-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 400;
    }

    #count {
      color: var(--muted);
      font: 0.78rem "Trebuchet MS", sans-serif;
    }

    #todo-list {
      display: grid;
      gap: 8px;
      padding: 14px 0 0;
      margin: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 8px 0 8px 2px;
      border-bottom: 1px solid rgba(229, 226, 218, 0.7);
      animation: appear 220ms ease both;
    }

    .todo-item input[type="checkbox"] {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 1.05rem;
      line-height: 1.45;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .delete-button {
      padding: 8px;
      color: var(--danger);
      background: transparent;
      font-size: 0.82rem;
    }

    .delete-button:hover { background: #f7e9e6; }

    .empty-message {
      margin: 20px 0 4px;
      color: var(--muted);
      text-align: center;
      font: 0.92rem "Trebuchet MS", sans-serif;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 460px) {
      body { padding: 12px; }
      main { padding: 30px 22px; }
      .todo-form { flex-direction: column; }
      .add-button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A small daily ritual</p>
    <h1>오늘의 할 일</h1>
    <p class="intro">해야 할 일을 하나씩 적고, 끝낸 일에는 체크해 보세요.</p>

    <form class="todo-form" id="todo-form">
      <input class="todo-input" id="todo-input" type="text" placeholder="새로운 할 일을 입력하세요" autocomplete="off" aria-label="할 일 입력">
      <button class="add-button" type="submit">추가하기</button>
    </form>

    <section aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">할 일 목록</h2>
        <span id="count">0개</span>
      </div>
      <ul id="todo-list"></ul>
      <p class="empty-message" id="empty-message">아직 등록된 할 일이 없습니다.</p>
    </section>
  </main>

  <script>
    const form = document.querySelector('#todo-form');
    const input = document.querySelector('#todo-input');
    const list = document.querySelector('#todo-list');
    const count = document.querySelector('#count');
    const emptyMessage = document.querySelector('#empty-message');

    function updateStatus() {
      const items = list.querySelectorAll('.todo-item');
      count.textContent = `${items.length}개`;
      emptyMessage.hidden = items.length > 0;
    }

    function addTodo(text) {
      const item = document.createElement('li');
      item.className = 'todo-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.setAttribute('aria-label', `${text} 완료 처리`);
      checkbox.addEventListener('change', () => {
        item.classList.toggle('completed', checkbox.checked);
      });

      const label = document.createElement('span');
      label.className = 'todo-text';
      label.textContent = text;

      const deleteButton = document.createElement('button');
      deleteButton.className = 'delete-button';
      deleteButton.type = 'button';
      deleteButton.textContent = '삭제';
      deleteButton.setAttribute('aria-label', `${text} 삭제`);
      deleteButton.addEventListener('click', () => {
        item.remove();
        updateStatus();
      });

      item.append(checkbox, label, deleteButton);
      list.append(item);
      updateStatus();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      addTodo(text);
      input.value = '';
      input.focus();
    });

    updateStatus();
  </script>
</body>
</html>
